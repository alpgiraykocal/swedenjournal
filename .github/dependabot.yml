version: 2

# Two ecosystems, for different reasons.
#
# github-actions pairs with the SHA pinning in workflows/deploy.yml: pinned SHAs are
# secure but frozen, and nothing would ever tell us a pinned action has shipped a fix.
# Dependabot rewrites the SHA and the trailing version comment together, so pinning
# stays maintainable instead of rotting.
#
# npm covers sharp / sharp-cli / exif-reader. They are devDependencies with no runtime
# footprint on the published site, but `npm ci` and the AVIF backfill do run in the
# deploy pipeline, so they are worth tracking.
#
# Nothing is filtered out here on purpose. An earlier version of this file ignored
# semver-major for sharp, which does not do what it looks like: sharp is a 0.x package,
# so its breaking changes land in the minor position and Dependabot classified
# 0.30.6 -> 0.35.3 as semver-minor and raised the PR anyway. Rather than encode a rule
# that quietly fails, the filtering is left off and the constraint is written down:
#
#   sharp and sharp-cli upgrades must not be merged on a green CI run alone.
#   03-tools/generate-image-variants.sh drives the sharp-cli binary directly and its
#   flags have changed across majors, and a new encoder can change AVIF output for
#   every photo. Re-run image generation and compare output before merging.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
