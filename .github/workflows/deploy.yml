name: Build and deploy to GitHub Pages

# Runs the SSG build (node 03-tools/build.mjs) on every push and publishes
# 01-website-ready-to-upload to GitHub Pages. You only edit in the content editor
# and push — this workflow pre-renders and deploys automatically.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA rather than a version tag. A tag is
# mutable: whoever controls the action's repo can repoint v4 at different code, and
# this workflow has write access to Pages, so a moved tag would run unreviewed code in
# the deploy pipeline. The trailing comment records which release each SHA is, so
# bumping stays readable — update both together.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
      # sharp (via the backfill-avif build step) is the only runtime dependency: it
      # encodes AVIF for editor-added photos that shipped without it. Everything else
      # in build.mjs uses Node built-ins. npm ci installs the pinned sharp-cli/sharp.
      - name: Install dependencies
        run: npm ci
      - name: Build (SSG pre-render)
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 01-website-ready-to-upload

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
